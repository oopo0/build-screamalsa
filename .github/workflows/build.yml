name: Build ScreamALSA Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 GCC 14 和编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 build-essential libelf-dev bc bison flex unzip

      - name: 设置 GCC 14 为默认编译器
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set g++ /usr/bin/g++-14
          gcc --version

      - name: 下载内核头文件
        run: |
          wget -O header-6.12.91-ophub.tar.gz \
            https://github.com/oopo0/build-screamalsa/releases/download/v1/header-6.12.91-ophub.tar.gz

      - name: 下载 ScreamALSA 源码
        run: |
          wget -O screamalsa-main.zip \
            https://github.com/oopo0/build-screamalsa/releases/download/v1/screamalsa-main.zip

      - name: 解压内核头文件
        run: |
          mkdir -p /tmp/kernel-headers
          tar -xzf header-6.12.91-ophub.tar.gz -C /tmp/kernel-headers
          echo "=== 内核头文件目录内容 ==="
          ls -la /tmp/kernel-headers/

      - name: 解压 ScreamALSA 源码
        run: |
          unzip -q screamalsa-main.zip
          echo "=== 解压后目录 ==="
          ls -la
          echo "=== screamalsa-main 目录内容 ==="
          ls -la screamalsa-main/

      - name: 编译模块
        run: |
          cd screamalsa-main
          make -C /tmp/kernel-headers M=$(pwd) modules

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: snd-screamalsa-ko
          path: screamalsa-main/snd-screamalsa.ko
          if-no-files-found: error
