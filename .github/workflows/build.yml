name: Build ScreamALSA Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev bc bison flex

      - name: 下载内核头文件
        run: |
          wget -O header-6.12.91-ophub.tar.gz \
            https://github.com/oopo0/build-screamalsa/releases/download/v1/header-6.12.91-ophub.tar.gz

      - name: 解压内核头文件
        run: |
          mkdir -p /tmp/kernel-headers
          tar -xzf header-6.12.91-ophub.tar.gz -C /tmp/kernel-headers
          echo "=== 内核头文件目录内容 ==="
          ls -la /tmp/kernel-headers/

      - name: 检查仓库内容
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          echo ""
          echo "=== screamalsa-main 目录 ==="
          ls -la screamalsa-main/ 2>/dev/null || echo "screamalsa-main 目录不存在"

      - name: 编译模块
        run: |
          cd screamalsa-main
          make -C /tmp/kernel-headers M=$(pwd) modules

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: snd-screamalsa-ko
          path: screamalsa-main/snd-screamalsa.ko
          if-no-files-found: error
